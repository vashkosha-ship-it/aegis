name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Браузерные проверки запускаются вручную: они ходят на боевой сайт и
  # выполняют выход, то есть отзывают действующие сессии тестовой учётки.
  workflow_dispatch:
  schedule:
    # Раз в неделю: уязвимость может появиться в уже установленной версии,
    # без единого изменения в нашем коде.
    - cron: "0 6 * * 1"

jobs:
  backend:
    runs-on: ubuntu-latest

    # Тесты работают с настоящей PostgreSQL: у нас JSON-колонки и enum,
    # на SQLite они ведут себя иначе и тест может пройти там, где прод упадёт.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neon
          POSTGRES_PASSWORD: neon_password
          POSTGRES_DB: neon_stack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis обязателен в production (rate limiting + очередь фоновых задач).
      # Гоняем тесты с ним, иначе поведение в CI и на сервере расходится.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://neon:neon_password@localhost:5432/neon_stack
      DATABASE_URL_SYNC: postgresql+psycopg2://neon:neon_password@localhost:5432/neon_stack
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-used-in-production
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Версия ruff зафиксирована: иначе новая версия добавляет правила,
          # и CI падает на коде, который локально проходил проверку.
          pip install pytest pytest-asyncio httpx ruff==0.16.3

      - name: Каталог хранилища
        # На сервере он существует, в чистом чекауте — нет. Без него
        # /ready справедливо сообщает о неготовности, и тест падает.
        run: mkdir -p storage

      - name: Ruff (линтер)
        run: ruff check app tests

      - name: Миграции применяются
        # Ловит битые и конфликтующие ревизии до того, как они попадут на сервер
        run: alembic upgrade head

      - name: Модели соответствуют миграциям
        # Если поле добавили в модель, а миграцию не написали — alembic check
        # это увидит. Без проверки расхождение обнаруживается только при
        # падении на проде.
        run: alembic check

      - name: Логика не продублирована между models и services
        # В app/models/gamification.py лежала устаревшая копия сервиса — с
        # ошибкой, которую в сервисе давно исправили. Обе выглядели рабочими,
        # и понять, какая выполняется, можно было только по импортам.
        working-directory: .
        run: python tools/check_duplicate_logic.py

      - name: Воркер фоновых задач импортируется
        # Воркер живёт отдельным процессом и в тесты не попадает: опечатка в
        # его импортах всплыла бы только на сервере.
        run: python -c "from app.worker import WorkerSettings; print(WorkerSettings.functions)"

      - name: Тесты
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить frontend-инструменты
        working-directory: .
        run: npm install --no-save --no-audit --no-fund eslint@9 jsdom@26

      - name: Проверка синтаксиса JS
        # Полноценного сборщика у фронта нет, но синтаксическую ошибку
        # в собственных JS-файлах поймать стоит — она кладёт весь интерфейс.
        run: |
          for f in app.js dynamic-styles.js app-state.js user-features.js library-home.js reader-core.js onboarding.js ar-schemes.js assistant-chat.js admin-screens.js auth-ui.js account-settings.js notes-crypto.js annotations-core.js annotations-ui.js quiz-core.js detail-training.js also-read.js favorite-categories.js mylist-api.js mylist-drag-drop.js mylist-screen.js custom-collections.js book-discussion.js reviews-core.js finish-review.js vendor-loader.js icons.js appearance-settings.js \
                   offline-settings.js loading-ui.js core-utils.js notifications.js dialogs.js pomodoro.js keyboard-shortcuts.js pwa-install.js onboarding-tour.js api.js sw.js offline-storage.js \
                   inline-handlers.js handler-allowlist.js csp-helpers.js analytics.js profile-insights.js profile-screen.js recommendations.js home-continue.js home-recommendations.js home-books-goal.js home-catalog.js reading-goals.js ai-responses.js reader-ai-panel.js navigation.js catalog-filters.js training-screen.js reader-theme.js reading-progress-sync.js flashcards.js reader-gestures.js page-bookmarks.js reader-toc.js reader-open.js offline-library.js offline-profile.js pull-to-refresh.js reader-search.js epub-annotations.js reader-selection-ai.js reader-lifecycle.js reader-navigation.js; do
            if [ -f "$f" ]; then
              echo "Проверяю $f"
              node --check "$f"
            fi
          done

      - name: Реестр обработчиков соответствует разметке
        # Диспетчер вызывает только то, что перечислено в реестре. Добавили
        # обработчик в разметку, забыли пересобрать реестр — кнопка молча
        # перестаёт работать. Скрипт пересобирает и сравнивает.
        working-directory: .
        run: |
          python tools/gen_allowlist.py
          git diff --exit-code frontend/handler-allowlist.js \
            || (echo "Реестр устарел: запусти python tools/gen_allowlist.py" && exit 1)

      - name: ESLint
        # Ошибки блокируют сборку, предупреждения ограничены текущим числом.
        # Так же, как с подстановками в innerHTML: разом их не вычистить, но
        # расти они не должны. Уменьшать порог по мере исправлений.
        working-directory: .
        run: npx --no-install eslint frontend --max-warnings 33

      - name: Новых неэкранированных подстановок нет
        # Присваиваний innerHTML во фронте больше сотни, переписать их разом
        # нельзя. Защёлка фиксирует текущее состояние и валит сборку, если
        # появится НОВАЯ подстановка без экранирования: старые чинятся
        # постепенно, а число их не растёт.
        working-directory: .
        run: python tools/audit_innerhtml.py --check

      - name: Тесты диспетчера обработчиков
        # Проверяют, что разметка, попавшая в DOM, не может позвать
        # произвольную функцию приложения.
        run: node tests/dispatcher.test.js

      - name: Тест корректного выхода
        run: node tests/api-logout.test.js

      - name: Биометрический вход полностью удалён
        run: node tests/biometric-removal.test.js

      - name: Тест экранирования пользовательского HTML
        run: node tests/xss-escaping.test.js

      - name: Тест UI аннотаций
        run: node tests/annotations-ui.test.js

      - name: Тест книжных тестов
        run: node tests/quiz-core.test.js

      - name: Тест вкладки обучения книги
        run: node tests/detail-training.test.js

      - name: Тест блока «Также читают»
        run: node tests/also-read.test.js

      - name: Тест закладок страниц
        run: node tests/page-bookmarks.test.js

      - name: Тест оглавления читалки
        run: node tests/reader-toc.test.js

      - name: Тест синхронизации прогресса
        run: node tests/reading-progress-sync.test.js

      - name: Тест pull-to-refresh
        run: node tests/pull-to-refresh.test.js

      - name: Тест поиска по книге
        run: node tests/reader-search.test.js

      - name: Тест EPUB-аннотаций
        run: node tests/epub-annotations.test.js

      - name: Тест выделения и AI в читалке
        run: node tests/reader-selection-ai.test.js

      - name: Тест lifecycle читалки
        run: node tests/reader-lifecycle.test.js

      - name: Тест офлайн-библиотеки
        run: node tests/offline-library.test.js

      - name: Тест офлайн-раздела профиля
        run: node tests/offline-profile.test.js

      - name: Тест интервального повторения
        run: node tests/flashcards.test.js

      - name: Тест жестов читалки
        run: node tests/reader-gestures.test.js

      - name: Тест открытия книги
        run: node tests/reader-open.test.js

      - name: Тест темы читалки
        run: node tests/reader-theme.test.js

      - name: Тест экрана обучения
        run: node tests/training-screen.test.js

      - name: Тест фильтров каталога
        run: node tests/catalog-filters.test.js

      - name: Тест навигации
        run: node tests/navigation.test.js

      - name: Тест рекомендаций
        run: node tests/recommendations.test.js

      - name: Тест блока «Продолжить чтение»
        run: node tests/home-continue.test.js

      - name: Тест целей чтения
