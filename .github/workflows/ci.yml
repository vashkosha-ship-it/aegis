name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Браузерные проверки запускаются вручную: они ходят на боевой сайт и
  # выполняют выход, то есть отзывают действующие сессии тестовой учётки.
  workflow_dispatch:
  schedule:
    # Раз в неделю: уязвимость может появиться в уже установленной версии,
    # без единого изменения в нашем коде.
    - cron: "0 6 * * 1"

jobs:
  backend:
    runs-on: ubuntu-latest

    # Тесты работают с настоящей PostgreSQL: у нас JSON-колонки и enum,
    # на SQLite они ведут себя иначе и тест может пройти там, где прод упадёт.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neon
          POSTGRES_PASSWORD: neon_password
          POSTGRES_DB: neon_stack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis обязателен в production (rate limiting + очередь фоновых задач).
      # Гоняем тесты с ним, иначе поведение в CI и на сервере расходится.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://neon:neon_password@localhost:5432/neon_stack
      DATABASE_URL_SYNC: postgresql+psycopg2://neon:neon_password@localhost:5432/neon_stack
      REDIS_URL: redis://localhost:6379/0
      QUEUE_REQUIRED_FOR_READINESS: "true"
      SECRET_KEY: ci-test-secret-key-not-used-in-production
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Версия ruff зафиксирована: иначе новая версия добавляет правила,
          # и CI падает на коде, который локально проходил проверку.
          pip install pytest pytest-asyncio httpx ruff==0.16.3

      - name: Каталог хранилища
        # На сервере он существует, в чистом чекауте — нет. Без него
        # /ready справедливо сообщает о неготовности, и тест падает.
        run: mkdir -p storage

      - name: Ruff (линтер)
        run: ruff check app tests

      - name: Миграции применяются
        # Ловит битые и конфликтующие ревизии до того, как они попадут на сервер
        run: alembic upgrade head

      - name: Модели соответствуют миграциям
        # Если поле добавили в модель, а миграцию не написали — alembic check
        # это увидит. Без проверки расхождение обнаруживается только при
        # падении на проде.
        run: alembic check

      - name: Логика не продублирована между models и services
        # В app/models/gamification.py лежала устаревшая копия сервиса — с
        # ошибкой, которую в сервисе давно исправили. Обе выглядели рабочими,
        # и понять, какая выполняется, можно было только по импортам.
        working-directory: .
        run: python tools/check_duplicate_logic.py

      - name: Воркер фоновых задач импортируется
        # Воркер живёт отдельным процессом и в тесты не попадает: опечатка в
        # его импортах всплыла бы только на сервере.
        run: python -c "from app.worker import WorkerSettings; print(WorkerSettings.functions)"

      - name: Тесты
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить frontend-инструменты
        working-directory: .
        run: npm install --no-save --no-audit --no-fund eslint@9 jsdom@26

      - name: Проверка синтаксиса JS
        # Полноценного сборщика у фронта нет, но синтаксическую ошибку
        # в собственных JS-файлах поймать стоит — она кладёт весь интерфейс.
        run: |
          for f in app.js dynamic-styles.js app-state.js user-features.js library-home.js reader-core.js onboarding.js ar-schemes-data.js ar-schemes-renderers.js ar-schemes-interactions.js ar-schemes.js assistant-chat.js admin-screens.js admin-users.js admin-ai-operations.js admin-books.js admin-bulk-upload.js auth-ui.js account-settings.js account-privacy.js account-personalization.js account-profile.js notes-crypto.js annotations-core.js annotations-ui.js quiz-core.js detail-training.js also-read.js favorite-categories.js mylist-api.js mylist-drag-drop.js mylist-screen.js custom-collections.js book-discussion.js reviews-core.js finish-review.js vendor-loader.js icons.js appearance-settings.js \
                   offline-settings.js loading-ui.js core-utils.js notifications.js dialogs.js pomodoro.js keyboard-shortcuts.js pwa-install.js onboarding-tour.js api.js sw.js offline.js offline-storage.js \
                   inline-handlers.js handler-allowlist.js csp-helpers.js analytics.js profile-insights.js profile-screen.js recommendations.js home-continue.js home-recommendations.js home-books-goal.js home-catalog.js reading-goals.js ai-responses.js reader-ai-panel.js navigation.js catalog-filters.js training-screen.js reader-theme.js reading-progress-sync.js flashcards.js reader-gestures.js page-bookmarks.js reader-toc.js reader-open.js offline-library.js offline-profile.js pull-to-refresh.js reader-search.js epub-annotations.js reader-selection-ai.js reader-lifecycle.js reader-navigation.js; do
            if [ -f "$f" ]; then
              echo "Проверяю $f"
              node --check "$f"
            fi
          done

      - name: Реестр обработчиков соответствует разметке
        # Диспетчер вызывает только то, что перечислено в реестре. Добавили
        # обработчик в разметку, забыли пересобрать реестр — кнопка молча
        # перестаёт работать. Скрипт пересобирает и сравнивает.
        working-directory: .
        run: |
          python tools/gen_allowlist.py
          git diff --exit-code frontend/handler-allowlist.js \
            || (echo "Реестр устарел: запусти python tools/gen_allowlist.py" && exit 1)

      - name: ESLint
        # Ошибки блокируют сборку, предупреждения ограничены текущим числом.
        # Так же, как с подстановками в innerHTML: разом их не вычистить, но
        # расти они не должны. Уменьшать порог по мере исправлений.
        working-directory: .
        run: npx --no-install eslint frontend --max-warnings 33

      - name: Новых неэкранированных подстановок нет
        # Присваиваний innerHTML во фронте больше сотни, переписать их разом
        # нельзя. Защёлка фиксирует текущее состояние и валит сборку, если
        # появится НОВАЯ подстановка без экранирования: старые чинятся
        # постепенно, а число их не растёт.
        working-directory: .
        run: python tools/audit_innerhtml.py --check

      - name: Полный набор frontend-тестов
        # Защита от случайно незапущенного файла: новые тесты раньше несколько
        # раз добавлялись второй строкой к однострочному run и становились
        # аргументом предыдущего node-процесса.
        run: |
          for test_file in tests/*.test.js; do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Скан блокирующий. Прежний continue-on-error означал, что находки видит
    # только тот, кто откроет вкладку с логами: жёлтая галочка выглядит как
    # зелёная, и уязвимость живёт до следующего аудита.
    #
    # Возражение «нельзя блокировать выкатку срочного исправления» решается не
    # отключением проверки, а списком исключений: уязвимость, которую сейчас
    # не устранить, вносится в backend/.pip-audit-ignore с датой и причиной.
    # Разница в том, что исключение осознанное и видно в истории репозитория.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить инструменты аудита
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Уязвимости в зависимостях
        # Сверяет версии из requirements.txt с базой известных уязвимостей.
        # --strict, чтобы падать и на ошибках разбора, а не только на находках.
        #
        # Идентификаторы из .pip-audit-ignore исключаются: это принятые риски,
        # каждый с датой и причиной в самом файле.
        run: |
          IGNORES=""
          if [ -f .pip-audit-ignore ]; then
            while IFS= read -r line; do
              case "$line" in ''|\#*) continue ;; esac
              IGNORES="$IGNORES --ignore-vuln ${line%% *}"
            done < .pip-audit-ignore
          fi
          echo "Исключения: ${IGNORES:-нет}"
          pip-audit --requirement requirements.txt --strict --desc $IGNORES

      - name: Устаревшие пакеты
        # Не проверка безопасности, а подсказка: чем дальше отстаём, тем
        # болезненнее будет обновление, когда уязвимость всё-таки найдут.
        # Отставание само по себе не повод не выкатываться, поэтому шаг
        # информационный — в отличие от скана выше.
        continue-on-error: true
        run: |
          pip install -r requirements.txt --quiet
          pip list --outdated

  # Критические браузерные сценарии на изолированном локальном стенде.
  # В отличие от production-e2e этот job выполняется на каждом PR и не меняет
  # боевые книги, отзывы, пароли или сессии. База и Redis уничтожаются вместе
  # с runner после завершения job.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neon
          POSTGRES_PASSWORD: neon_password
          POSTGRES_DB: neon_stack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://neon:neon_password@localhost:5432/neon_stack
      DATABASE_URL_SYNC: postgresql+psycopg2://neon:neon_password@localhost:5432/neon_stack
      REDIS_URL: redis://localhost:6379/0
      QUEUE_REQUIRED_FOR_READINESS: "true"
      SECRET_KEY: e2e-ci-secret-key-not-used-in-production
      DEBUG: "true"
      CORS_ORIGINS: http://aegis.test:8080
      FRONTEND_BASE_URL: http://aegis.test:8080
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: ./storage
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      E2E_BASE_URL: http://aegis.test:8080
      E2E_USERNAME: e2e_reader
      E2E_PASSWORD: e2e-reader-password
      E2E_ACCOUNT_USERNAME: e2e_account
      E2E_ACCOUNT_PASSWORD: e2e-account-password
      E2E_ADMIN_USERNAME: e2e_admin
      E2E_ADMIN_PASSWORD: e2e-admin-password
      E2E_ADMIN_RECOVERY_CODE: E2E2-E2E2-E2E2-E2E2
      AEGIS_E2E_SEED: local-ci-only
      AEGIS_E2E_MAIL_DIR: /tmp/aegis-e2e-mail

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить backend и nginx
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y nginx

      - name: Поднять изолированный стенд
        run: |
          mkdir -p "$AEGIS_E2E_MAIL_DIR" backend/storage
          python e2e/support/smtp_capture.py \
            --output-dir "$AEGIS_E2E_MAIL_DIR" \
            >/tmp/aegis-e2e-smtp.log 2>&1 &
          cd backend
          alembic upgrade head
          python -m scripts.seed_e2e
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            >/tmp/aegis-e2e-backend.log 2>&1 &
          cd ..
          sed "s|__WORKSPACE__|$GITHUB_WORKSPACE|g" \
            e2e/nginx-ci.conf >/tmp/aegis-e2e-nginx.conf
          nginx -c /tmp/aegis-e2e-nginx.conf
          echo "127.0.0.1 aegis.test" | sudo tee -a /etc/hosts >/dev/null
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null \
              && curl -fsS -H 'Host: aegis.test' http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aegis-e2e-backend.log
          cat /tmp/aegis-e2e-nginx-error.log
          exit 1

      - name: Установить Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Критические E2E
        working-directory: e2e
        run: npx playwright test --grep @critical

      - name: Диагностика при падении
        if: failure()
        run: |
          tail -n 300 /tmp/aegis-e2e-backend.log || true
          tail -n 300 /tmp/aegis-e2e-nginx-error.log || true
          tail -n 100 /tmp/aegis-e2e-smtp.log || true

      - name: Отчёт критических E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-e2e-report
          path: e2e/test-results/
          retention-days: 7

  # Браузерные проверки развёрнутого сайта.
  #
  # Отдельно от остальных задач и не на каждый коммит: они требуют работающего
  # сервера и учётной записи. Смысл в том, чтобы поймать расхождение между
  # «код правильный» и «сайт работает» — заголовки CSP, флаги cookie, реально
  # подключённые скрипты. Дважды за время работы такое расхождение находилось
  # только вручную.
  #
  # Запускается вручную (Actions → Run workflow), раз в неделю по расписанию
  # и один раз с merge-коммита, помеченного [production-e2e]. Метка позволяет
  # подтвердить production-прогон из истории репозитория, не отзывая сессии
  # тестовой учётки на каждом обычном push.
  # Для ручного и планового production-прогона отсутствие секретов — ошибка
  # конфигурации, а не успешный skip. На обычных push/PR этот job не запускается.
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[production-e2e]'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - name: Проверить наличие настроек
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
          USERNAME: ${{ secrets.E2E_USERNAME }}
          PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          missing=0
          for name in BASE_URL USERNAME PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Не задан обязательный E2E-секрет: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить зависимости
        run: npm ci || npm install

      - name: Установить браузер
        run: npx playwright install --with-deps chromium

      - name: Браузерные проверки
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test

      - name: Отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7
