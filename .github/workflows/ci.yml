name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Браузерные проверки запускаются вручную: они ходят на боевой сайт и
  # выполняют выход, то есть отзывают действующие сессии тестовой учётки.
  workflow_dispatch:
  schedule:
    # Раз в неделю: уязвимость может появиться в уже установленной версии,
    # без единого изменения в нашем коде.
    - cron: "0 6 * * 1"

jobs:
  backend:
    runs-on: ubuntu-latest

    # Тесты работают с настоящей PostgreSQL: у нас JSON-колонки и enum,
    # на SQLite они ведут себя иначе и тест может пройти там, где прод упадёт.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neon
          POSTGRES_PASSWORD: neon_password
          POSTGRES_DB: neon_stack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis обязателен в production (rate limiting + очередь фоновых задач).
      # Гоняем тесты с ним, иначе поведение в CI и на сервере расходится.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://neon:neon_password@localhost:5432/neon_stack
      DATABASE_URL_SYNC: postgresql+psycopg2://neon:neon_password@localhost:5432/neon_stack
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-used-in-production
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Версия ruff зафиксирована: иначе новая версия добавляет правила,
          # и CI падает на коде, который локально проходил проверку.
          pip install pytest pytest-asyncio httpx ruff==0.16.3

      - name: Каталог хранилища
        # На сервере он существует, в чистом чекауте — нет. Без него
        # /ready справедливо сообщает о неготовности, и тест падает.
        run: mkdir -p storage

      - name: Ruff (линтер)
        run: ruff check app tests

      - name: Миграции применяются
        # Ловит битые и конфликтующие ревизии до того, как они попадут на сервер
        run: alembic upgrade head

      - name: Модели соответствуют миграциям
        # Если поле добавили в модель, а миграцию не написали — alembic check
        # это увидит. Без проверки расхождение обнаруживается только при
        # падении на проде.
        run: alembic check

      - name: Воркер фоновых задач импортируется
        # Воркер живёт отдельным процессом и в тесты не попадает: опечатка в
        # его импортах всплыла бы только на сервере.
        run: python -c "from app.worker import WorkerSettings; print(WorkerSettings.functions)"

      - name: Тесты
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Проверка синтаксиса JS
        # Полноценного сборщика у фронта нет, но синтаксическую ошибку
        # в app.js/api.js/sw.js поймать стоит — она кладёт весь интерфейс.
        run: |
          for f in app.js api.js sw.js offline-storage.js \
                   inline-handlers.js handler-allowlist.js csp-helpers.js; do
            if [ -f "$f" ]; then
              echo "Проверяю $f"
              node --check "$f"
            fi
          done

      - name: Реестр обработчиков соответствует разметке
        # Диспетчер вызывает только то, что перечислено в реестре. Добавили
        # обработчик в разметку, забыли пересобрать реестр — кнопка молча
        # перестаёт работать. Скрипт пересобирает и сравнивает.
        working-directory: .
        run: |
          python tools/gen_allowlist.py
          git diff --exit-code frontend/handler-allowlist.js \
            || (echo "Реестр устарел: запусти python tools/gen_allowlist.py" && exit 1)

      - name: Тесты диспетчера обработчиков
        # Проверяют, что разметка, попавшая в DOM, не может позвать
        # произвольную функцию приложения.
        run: |
          npm install --no-save jsdom
          node tests/dispatcher.test.js

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Скан блокирующий. Прежний continue-on-error означал, что находки видит
    # только тот, кто откроет вкладку с логами: жёлтая галочка выглядит как
    # зелёная, и уязвимость живёт до следующего аудита.
    #
    # Возражение «нельзя блокировать выкатку срочного исправления» решается не
    # отключением проверки, а списком исключений: уязвимость, которую сейчас
    # не устранить, вносится в backend/.pip-audit-ignore с датой и причиной.
    # Разница в том, что исключение осознанное и видно в истории репозитория.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить инструменты аудита
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Уязвимости в зависимостях
        # Сверяет версии из requirements.txt с базой известных уязвимостей.
        # --strict, чтобы падать и на ошибках разбора, а не только на находках.
        #
        # Идентификаторы из .pip-audit-ignore исключаются: это принятые риски,
        # каждый с датой и причиной в самом файле.
        run: |
          IGNORES=""
          if [ -f .pip-audit-ignore ]; then
            while IFS= read -r line; do
              case "$line" in ''|\#*) continue ;; esac
              IGNORES="$IGNORES --ignore-vuln ${line%% *}"
            done < .pip-audit-ignore
          fi
          echo "Исключения: ${IGNORES:-нет}"
          pip-audit --requirement requirements.txt --strict --desc $IGNORES

      - name: Устаревшие пакеты
        # Не проверка безопасности, а подсказка: чем дальше отстаём, тем
        # болезненнее будет обновление, когда уязвимость всё-таки найдут.
        # Отставание само по себе не повод не выкатываться, поэтому шаг
        # информационный — в отличие от скана выше.
        continue-on-error: true
        run: |
          pip install -r requirements.txt --quiet
          pip list --outdated

  # Браузерные проверки развёрнутого сайта.
  #
  # Отдельно от остальных задач и не на каждый коммит: они требуют работающего
  # сервера и учётной записи. Смысл в том, чтобы поймать расхождение между
  # «код правильный» и «сайт работает» — заголовки CSP, флаги cookie, реально
  # подключённые скрипты. Дважды за время работы такое расхождение находилось
  # только вручную.
  #
  # Запускается вручную (Actions → Run workflow) и раз в неделю по расписанию.
  # Без настроенных секретов задача пропускается, а не падает: иначе форк или
  # чужой PR получал бы красную сборку из-за отсутствия чужих доступов.
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - name: Проверить наличие настроек
        id: config
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "Секрет E2E_BASE_URL не задан — проверки пропущены"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: "20"

      - name: Установить зависимости
        if: steps.config.outputs.ready == 'true'
        run: npm ci || npm install

      - name: Установить браузер
        if: steps.config.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Браузерные проверки
        if: steps.config.outputs.ready == 'true'
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test

      - name: Отчёт при падении
        if: failure() && steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
