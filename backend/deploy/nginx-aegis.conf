# Конфигурация nginx для Aegis.
#
# Установка на сервере:
#   cp deploy/nginx-aegis.conf /etc/nginx/sites-available/aegis
#   cp deploy/aegis-security-headers.conf /etc/nginx/snippets/
#   ln -sf /etc/nginx/sites-available/aegis /etc/nginx/sites-enabled/aegis
#   nginx -t && systemctl reload nginx
#
# HTTPS-часть добавляет certbot:
#   certbot --nginx -d aegis-sec-library.ru -d www.aegis-sec-library.ru

server {
    listen 80;
    server_name aegis-sec-library.ru www.aegis-sec-library.ru;

    # Весь трафик — только по HTTPS. Certbot заменит этот блок на свой
    # редирект после выпуска сертификата.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aegis-sec-library.ru www.aegis-sec-library.ru;

    # Каталог фронта. На сервере это симлинк на /opt/aegis/frontend, чтобы
    # git pull сразу обновлял сайт без ручного копирования.
    root /var/www/aegis;
    index index.html;

    # Книги грузятся файлами до 200 МБ
    client_max_body_size 200M;

    # CSP и прочие заголовки безопасности
    include snippets/aegis-security-headers.conf;

    # Точки входа приложения не кэшируем: иначе правки кода не доезжают до
    # пользователей, пока они вручную не почистят кэш.
    # ВАЖНО: include повторяется, потому что в nginx add_header из родительского
    # блока перестаёт наследоваться, если в дочернем объявлен свой.
    location ~* \.(?:js|html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include snippets/aegis-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Внутренняя отдача книг: backend проверяет права и возвращает заголовок
    # X-Accel-Redirect, дальше файл отдаёт nginx напрямую с диска. Так тяжёлая
    # передача не занимает воркеры Python, а Range-запросы (постраничная
    # загрузка PDF) работают штатно.
    # internal — снаружи этот путь недоступен.
    location /_protected_pdf/ {
        internal;
        alias /opt/aegis/backend/storage/;
    }

    # Отдача PDF: отдельный блок, потому что нужны Range-заголовки и длинные
    # таймауты — большая книга может качаться минутами.
    location ~ ^/api/books/\d+/pdf$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Без проброса Range pdf.js не сможет грузить книгу по частям и будет
        # скачивать её целиком.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_buffering on;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;

        # Реальный адрес клиента: без этих заголовков rate limit считает всех
        # пользователей как один IP (адрес самого nginx).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Выключено ради стриминга (SSE-ответы ассистента приходят по частям)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # --- SSL (управляется certbot) -----------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/aegis-sec-library.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aegis-sec-library.ru/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}
