# Ограничение размера системного журнала.
#
# Ставится в /etc/systemd/journald.conf.d/aegis.conf
#
# Зачем: приложение, воркер и nginx пишут в journald, и по умолчанию он
# занимает до 10% раздела — на диске в 50 ГБ это 5 ГБ логов. Индексация книг
# и фоновый брутфорс SSH дают заметный поток записей, так что предел
# достигается быстрее, чем кажется.
#
# После правки: systemctl restart systemd-journald

[Journal]
# Верхняя граница на весь журнал
SystemMaxUse=1G

# Размер одного файла — мельче файлы, точнее ротация
SystemMaxFileSize=100M

# Не хранить дольше месяца: старые записи всё равно бесполезны для разбора
MaxRetentionSec=1month

# Оставить на диске не меньше этого объёма свободным
SystemKeepFree=2G
