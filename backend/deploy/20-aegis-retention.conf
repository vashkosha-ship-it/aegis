# Ограничение локального systemd journal на небольшом production-сервере.
#
# Устанавливается как /etc/systemd/journald.conf.d/20-aegis-retention.conf.
# Настройки глобальны для journal: отдельный лимит по unit journald не
# поддерживает. 500 МБ достаточно для диагностики и не позволяет логам
# незаметно занять диск.
[Journal]
SystemMaxUse=500M
RuntimeMaxUse=100M
MaxRetentionSec=30day
