# /etc/nginx/snippets/aegis-security-headers.conf
#
# Заголовки безопасности для статики Aegis. Подключается через include в
# каждом location, где есть свои add_header — в nginx add_header НЕ наследуется
# из родительского блока, если в дочернем объявлен хотя бы один свой.
#
# Про CSP.
#
# script-src больше не содержит 'unsafe-inline'. Инлайновые обработчики
# переехали в data-onclick, разбором занимается frontend/inline-handlers.js.
# Это и есть смысл всей затеи: с 'unsafe-inline' любой текст, попавший в DOM
# через innerHTML, мог выполниться как скрипт — то есть политика существовала,
# но от XSS не защищала.
#
# 'unsafe-eval' тоже убран. Диспетчер обработчиков разбирает вызовы вручную,
# без eval и new Function, иначе мы бы просто поменяли одну лазейку на другую.
#
# style-src 'unsafe-inline' СОХРАНЁН осознанно. В разметке несколько сотен
# атрибутов style=, а для них nonce не работает — он применим только к
# элементам <style>. Убрать их значит переписать всю вёрстку в классы, при том
# что инлайновый стиль сам по себе выполнить код не даёт. Вынесено в отдельную
# задачу.

# --- Этап 1: наблюдение (пройден) ---------------------------------------
# Обход по всем экранам не дал ни одного нарушения — в том числе на чтении
# PDF, где были опасения насчёт 'unsafe-eval' в pdf.js. Строки ниже оставлены
# закомментированными: понадобятся, если политику придётся ужесточать дальше
# (например, убирать 'unsafe-inline' из style-src).
#
# add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Прежняя разрешающая политика — на случай срочного отката.
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# --- Этап 2: включено ---------------------------------------------------
# Инлайновые скрипты и eval запрещены. Внедрённый в DOM текст больше не может
# выполниться — ради этого всё и затевалось.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# HSTS: браузер запоминает, что сюда можно ходить только по HTTPS, и
# перестаёт делать первый http-запрос, который можно перехватить.
# max-age год — рекомендуемое значение.
#
# ВАЖНО: includeSubDomains распространяет правило на ВСЕ поддомены. Если
# появится поддомен без сертификата, он станет недоступен, и откатить это
# нельзя — браузеры помнят политику до истечения max-age. Директива preload
# намеренно не добавлена: попадание в список браузеров необратимо.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), payment=()" always;
