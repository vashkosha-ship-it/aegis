# Конфигурация Ruff — линтер и форматтер для Python.
# Правила подобраны мягко: цель на первом этапе — ловить настоящие ошибки
# (неиспользуемые импорты, опечатки в именах, битые f-строки), а не спорить
# о стиле в существующем коде.

line-length = 100
target-version = "py312"

exclude = [
    ".venv",
    "alembic/versions",  # автогенерированные миграции
    "__pycache__",
]

[lint]
select = [
    "E",    # pycodestyle: ошибки
    "F",    # pyflakes: неиспользуемые импорты/переменные, битые ссылки
    "I",    # isort: порядок импортов
    "B",    # flake8-bugbear: типичные ловушки
    "UP",   # pyupgrade: устаревшие конструкции
]

ignore = [
    "E501",  # длина строки — не блокируем, есть длинные SQL и сообщения
    "B008",  # Depends() в аргументах по умолчанию — это норма для FastAPI
]

[lint.per-file-ignores]
# В тестах допустимы длинные фикстуры и импорты внутри функций
"tests/*" = ["F401", "F811"]

[lint.isort]
known-first-party = ["app"]
