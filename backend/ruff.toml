# Конфигурация Ruff — линтер для Python.
# Правила подобраны мягко: цель — ловить настоящие ошибки (неиспользуемые
# импорты, опечатки в именах, битые f-строки), а не спорить о стиле.

line-length = 100
target-version = "py312"

exclude = [
    ".venv",
    "alembic/versions",  # автогенерированные миграции
    "__pycache__",
]

[lint]
select = [
    "E",    # pycodestyle: ошибки
    "F",    # pyflakes: неиспользуемые импорты/переменные, битые ссылки
    "I",    # isort: порядок импортов
    "B",    # flake8-bugbear: типичные ловушки
    "UP",   # pyupgrade: устаревшие конструкции
]

ignore = [
    "E501",   # длина строки — не блокируем, есть длинные SQL и сообщения
    "B008",   # Depends() в аргументах по умолчанию — норма для FastAPI
    "E402",   # импорты не вверху файла — намеренные, разрывают циклы зависимостей
    "UP042",  # str+Enum → StrEnum: влияет на сериализацию в API и запись в БД
]

[lint.per-file-ignores]
# В тестах допустимы длинные фикстуры и импорты внутри функций
"tests/*" = ["F401", "F811"]

# SQLAlchemy-отношения объявляются строкой: Mapped["User"]. Имя разрешает сам
# SQLAlchemy в рантайме, а модели ссылаются друг на друга кругами, поэтому
# импортировать их по-настоящему нельзя. Для Ruff такие имена выглядят
# неопределёнными — это ложное срабатывание, не баг.
"app/models/*" = ["F821"]

# Файл существует ради реэкспорта: импорты здесь «неиспользуемые» намеренно,
# они нужны, чтобы Alembic и SQLAlchemy увидели все модели.
"app/models/__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["app"]
