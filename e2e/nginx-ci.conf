worker_processes 1;
pid /tmp/aegis-e2e-nginx.pid;
error_log /tmp/aegis-e2e-nginx-error.log;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    access_log /tmp/aegis-e2e-nginx-access.log;
    client_body_temp_path /tmp/aegis-e2e-client-body;
    proxy_temp_path /tmp/aegis-e2e-proxy;
    sendfile on;

    server {
        listen 8080;
        server_name aegis.test;
        root __WORKSPACE__/frontend;

        location /_protected_pdf/ {
            internal;
            alias __WORKSPACE__/backend/storage/;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
